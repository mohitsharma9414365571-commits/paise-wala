name: paise_wala
description: Paise Wala rewards app - Flutter mobile project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  supabase_flutter: ^2.8.4
  flutter:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0879E8"
  adaptive_icon_foreground: assets/icon/app_icon.png
